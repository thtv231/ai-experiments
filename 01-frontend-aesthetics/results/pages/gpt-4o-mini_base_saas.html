<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huddle - Schedule Team Meetings</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Lato', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 2.5em;
            margin: 0;
        }
        h2 {
            font-size: 1.5em;
            margin: 10px 0;
        }
        section {
            padding: 40px 20px;
            max-width: 800px;
            margin: auto;
            text-align: center;
        }
        .cta-button {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 15px 30px;
            font-size: 1.2em;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        .cta-button:hover {
            background-color: #218838;
        }
        footer {
            padding: 20px;
            text-align: center;
            background-color: #333;
            color: white;
            position: relative;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Huddle</h1>
        <h2>Your Team Meeting Scheduler</h2>
    </header>
    <section>
        <h2>Effortless Scheduling</h2>
        <p>Huddle takes the hassle out of scheduling meetings. With just a few clicks, you can coordinate with your team and find the perfect time that works for everyone.</p>
        <a href="#" class="cta-button">Get Started</a>
    </section>
    <footer>
        <p>&copy; 2023 Huddle. All rights reserved.</p>
    </footer>
</body>
</html>
