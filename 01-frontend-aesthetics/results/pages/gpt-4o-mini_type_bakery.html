<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakery Sales Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f9f5f0;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        h2 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.8em;
            margin: 20px 0 10px 0;
        }
        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
        }
        .revenue {
            font-size: 2em;
            color: #d88a3c;
        }
        .best-sellers {
            list-style-type: none;
            padding: 0;
        }
        .best-sellers li {
            background: #f2e4d5;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .chart {
            width: 100%;
            height: 200px;
            background: #e2e2e2;
            border-radius: 5px;
            position: relative;
            margin: 20px 0;
            overflow: hidden;
        }
        .bar {
            position: absolute;
            bottom: 0;
            background: #d88a3c;
            border-radius: 5px;
            transition: height 0.3s ease;
        }
        /* Example bar heights for weekly revenues (in percentage) */
        .bar1 { height: 50%; left: 10%; width: 15%; }
        .bar2 { height: 60%; left: 30%; width: 15%; }
        .bar3 { height: 80%; left: 50%; width: 15%; }
        .bar4 { height: 40%; left: 70%; width: 15%; }
        .bar5 { height: 70%; left: 90%; width: 15%; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Neighborhood Bakery Sales Dashboard</h1>
        <div class="revenue">Today's Revenue: $450</div>
        
        <h2>Best Sellers</h2>
        <ul class="best-sellers">
            <li>Chocolate Croissant</li>
            <li>Vanilla Cupcake</li>
            <li>Sourdough Bread</li>
            <li>Cheese Danish</li>
            <li>Blueberry Muffin</li>
        </ul>

        <h2>Weekly Revenue Chart</h2>
        <div class="chart">
            <div class="bar bar1"></div>
            <div class="bar bar2"></div>
            <div class="bar bar3"></div>
            <div class="bar bar4"></div>
            <div class="bar bar5"></div>
        </div>
    </div>
</body>
</html>
